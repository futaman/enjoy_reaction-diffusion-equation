<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>草とウサギの模様ドリル</title>
<meta name="description" content="中学数学レベルから反応拡散方程式（Gray-Scott モデル）を学び、自分で模様を作れるようになるドリル">
<style>
/* base.css */
/* ===== デザイントークン ===== */
:root {
  --paper: #faf8f2;
  --paper-grid: rgba(70, 110, 170, 0.07);
  --card: #ffffff;
  --card-2: #f4f2ec;
  --ink: #24272c;
  --ink-2: #5d636c;
  --ink-3: #8a9099;
  --line: #ddd8cb;
  --accent: #2f68b0;
  --accent-ink: #ffffff;
  --accent-soft: #e5eef9;
  --ok: #2c7a4b;
  --ok-soft: #e3f3e8;
  --ng: #b4462f;
  --ng-soft: #fbe9e4;
  --hint: #8a6a12;
  --hint-soft: #fbf3dc;
  --teacher: #7a4a9a;
  --teacher-soft: #f3ebf8;

  /* 式の項の色（M05） */
  --t-diff: #2f68b0;
  --t-feed: #3a8a35;
  --t-react: #d27a1e;
  --t-decay: #8a4fb5;
  --t-u: #3a8a35;   /* 草 */
  --t-v: #9a5a2a;   /* ウサギ */

  --radius: 10px;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.06), 0 2px 8px rgba(0, 0, 0, 0.04);
  --font: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
  --font-math: "Cambria Math", "STIX Two Math", "Times New Roman", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --font-mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #1a1c20;
    --paper-grid: rgba(140, 170, 220, 0.05);
    --card: #23262b;
    --card-2: #2b2f35;
    --ink: #e9e6df;
    --ink-2: #b3b7be;
    --ink-3: #868b93;
    --line: #3a3e45;
    --accent: #7fb0f0;
    --accent-ink: #10213a;
    --accent-soft: #233348;
    --ok: #6cc690;
    --ok-soft: #1f3528;
    --ng: #f08a72;
    --ng-soft: #3d2620;
    --hint: #e3c062;
    --hint-soft: #36301c;
    --teacher: #c79ae6;
    --teacher-soft: #2f2539;
    --t-diff: #7fb0f0;
    --t-feed: #7ccd73;
    --t-react: #f4a85a;
    --t-decay: #c49aea;
    --t-u: #7ccd73;
    --t-v: #e0a070;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #1a1c20;
  --paper-grid: rgba(140, 170, 220, 0.05);
  --card: #23262b;
  --card-2: #2b2f35;
  --ink: #e9e6df;
  --ink-2: #b3b7be;
  --ink-3: #868b93;
  --line: #3a3e45;
  --accent: #7fb0f0;
  --accent-ink: #10213a;
  --accent-soft: #233348;
  --ok: #6cc690;
  --ok-soft: #1f3528;
  --ng: #f08a72;
  --ng-soft: #3d2620;
  --hint: #e3c062;
  --hint-soft: #36301c;
  --teacher: #c79ae6;
  --teacher-soft: #2f2539;
  --t-diff: #7fb0f0;
  --t-feed: #7ccd73;
  --t-react: #f4a85a;
  --t-decay: #c49aea;
  --t-u: #7ccd73;
  --t-v: #e0a070;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
  color-scheme: dark;
}

/* ===== ベース ===== */
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
/* scrollIntoView やページ内リンクで、上にくっついたヘッダーの下に隠れないように */
html { -webkit-text-size-adjust: 100%; scroll-padding-top: 64px; }
body {
  margin: 0;
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.85;
  color: var(--ink);
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--paper-grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--paper-grid) 1px, transparent 1px);
  background-size: 24px 24px;
  overflow-x: hidden;
}
a { color: var(--accent); }
button, input, select { font: inherit; color: inherit; }
img, canvas { max-width: 100%; }
h1, h2, h3, h4 { line-height: 1.4; margin: 1.4em 0 0.5em; }
h1 { font-size: 1.6rem; }
h2 { font-size: 1.3rem; }
h3 { font-size: 1.1rem; }
p { margin: 0.6em 0; }
ruby rt { font-size: 0.55em; color: var(--ink-2); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ===== ヘッダー ===== */
.app-header {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 12px;
  padding: 8px 16px;
  background: color-mix(in srgb, var(--paper) 92%, transparent);
  backdrop-filter: blur(6px);
  border-bottom: 1px solid var(--line);
}
.app-header .brand { font-weight: 700; text-decoration: none; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.app-header .spacer { flex: 1; }
.app-header .icon-btn { background: none; border: 1px solid var(--line); border-radius: 8px; padding: 2px 10px; cursor: pointer; font-size: 0.9rem; white-space: nowrap; min-height: 34px; }
@media (max-width: 520px) { .app-header .icon-btn .lbl { display: none; } .app-header { gap: 8px; } }

.page { max-width: 1120px; margin: 0 auto; padding: 16px 16px 96px; }

/* ===== 章の頭とお尻 ===== */
.ch-head { margin: 8px 0 20px; }
.ch-head .ch-no { color: var(--accent); font-weight: 700; font-size: 0.95rem; }
.ch-head h1 { margin: 0.1em 0 0.3em; }
.ch-goal {
  display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap;
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 10px 14px; box-shadow: var(--shadow);
}
.ch-goal .label { font-weight: 700; color: var(--accent); white-space: nowrap; }
.ch-progress { margin-left: auto; font-size: 0.9rem; color: var(--ink-2); white-space: nowrap; }
.ch-progress.cleared { color: var(--ok); font-weight: 700; }
.ch-nav { display: flex; gap: 8px; justify-content: space-between; margin-top: 40px; flex-wrap: wrap; }

/* ===== ステップ（左：解説、右：デモ） ===== */
.step {
  display: grid; grid-template-columns: 1fr; gap: 16px;
  margin: 28px 0;
}
.step > h2 { grid-column: 1 / -1; margin: 0; padding-bottom: 4px; border-bottom: 2px solid var(--line); }
.step-text, .step-demo { min-width: 0; }
@media (min-width: 960px) {
  .step.two { grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); align-items: start; }
  .step.two .step-demo { position: sticky; top: 64px; }
}

.card {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 14px 16px; box-shadow: var(--shadow);
}
.card + .card { margin-top: 12px; }
.card-title { font-weight: 700; font-size: 0.95rem; margin: 0 0 8px; color: var(--ink-2); }

.note { border-left: 4px solid var(--accent); background: var(--accent-soft); padding: 8px 14px; border-radius: 0 8px 8px 0; margin: 12px 0; }
.note.story { border-color: var(--t-u); background: color-mix(in srgb, var(--t-u) 10%, var(--card)); }
.note.warn { border-color: var(--ng); background: var(--ng-soft); }
.note.mystery { border-color: var(--t-decay); background: color-mix(in srgb, var(--t-decay) 12%, var(--card)); }
.note > :first-child { margin-top: 0; } .note > :last-child { margin-bottom: 0; }

details.more, details.teacher {
  border: 1px dashed var(--line); border-radius: var(--radius); margin: 12px 0; background: var(--card);
}
details.more > summary, details.teacher > summary {
  cursor: pointer; padding: 8px 14px; font-weight: 700; font-size: 0.95rem; color: var(--ink-2); list-style: none;
}
details.more > summary::-webkit-details-marker, details.teacher > summary::-webkit-details-marker { display: none; }
details.more > summary::before { content: "＋ "; }
details.more[open] > summary::before { content: "− "; }
details.more > .body, details.teacher > .body { padding: 0 14px 10px; }
details.teacher { border-color: color-mix(in srgb, var(--teacher) 45%, transparent); background: var(--teacher-soft); }
details.teacher > summary { color: var(--teacher); }
details.teacher > summary::before { content: "📝 "; }

/* ===== 式 ===== */
.math { font-family: var(--font-math); font-style: normal; white-space: nowrap; }
.math i, i.v { font-family: var(--font-math); font-style: italic; }
.frac { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; line-height: 1.15; margin: 0 2px; font-family: var(--font-math); }
.frac > span:first-child { border-bottom: 1px solid currentColor; padding: 0 2px; }
.frac > span:last-child { padding: 0 2px; }
.math-block { display: block; text-align: center; font-size: 1.2rem; margin: 12px 0; overflow-x: auto; padding: 4px 0; white-space: normal; }
.t-diff { color: var(--t-diff); }
.t-feed { color: var(--t-feed); }
.t-react { color: var(--t-react); }
.t-decay { color: var(--t-decay); }
.t-u { color: var(--t-u); }
.t-v { color: var(--t-v); }

.equation { font-family: var(--font-math); font-size: 1.15rem; line-height: 2.4; overflow-x: auto; }
.equation .eq-line { white-space: nowrap; }
.equation .term {
  display: inline-block; padding: 0 6px; margin: 0 1px; border-radius: 6px; border: 1.5px solid currentColor;
  background: color-mix(in srgb, currentColor 9%, transparent); line-height: 1.6;
}
.equation.interactive .term { cursor: pointer; user-select: none; }
.equation .term.off { opacity: 0.35; text-decoration: line-through; border-style: dashed; }
.equation .legend { font-family: var(--font); font-size: 0.85rem; line-height: 1.6; display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 4px; }
.equation .legend span::before { content: "■ "; }

/* ===== 操作部品 ===== */
.btn {
  display: inline-flex; align-items: center; gap: 6px; justify-content: center;
  border: 1px solid var(--line); background: var(--card); border-radius: 8px;
  padding: 6px 14px; cursor: pointer; min-height: 38px; line-height: 1.3; text-decoration: none; color: var(--ink);
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
.btn.small { min-height: 30px; padding: 2px 10px; font-size: 0.9rem; }
.btn.on { background: var(--accent-soft); border-color: var(--accent); }
.btn[disabled] { opacity: 0.5; cursor: default; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.row + .row { margin-top: 8px; }

.slider { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 10px; align-items: center; margin: 6px 0; }
.slider label { font-size: 0.92rem; white-space: nowrap; }
.slider input[type=range] { width: 100%; min-width: 0; accent-color: var(--accent); }
.slider output { font-family: var(--font-mono); font-size: 0.9rem; min-width: 4.5em; text-align: right; }

.toggle { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; font-size: 0.95rem; }
.toggle input { width: 18px; height: 18px; accent-color: var(--accent); }

.seg { display: inline-flex; flex-wrap: wrap; gap: 4px; }
.seg button { border: 1px solid var(--line); border-radius: 8px; background: var(--card); padding: 4px 12px; cursor: pointer; min-height: 34px; white-space: nowrap; }
.seg button.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

/* 数字のマス */
.numgrid { display: inline-grid; gap: 3px; font-family: var(--font-mono); }
.numgrid .cell {
  width: 3.6em; height: 2.6em; display: flex; align-items: center; justify-content: center;
  border: 1px solid var(--line); border-radius: 6px; background: var(--card); font-size: 0.92rem; position: relative;
}
.numgrid .cell.hl { outline: 3px solid var(--accent); outline-offset: -1px; z-index: 1; }
.numgrid .cell.dim { opacity: 0.45; }
.numgrid .cell input { width: 100%; height: 100%; border: 0; background: transparent; text-align: center; font: inherit; padding: 0; }
.numgrid .cell.ok { border-color: var(--ok); background: var(--ok-soft); }
.numgrid .cell.ng { border-color: var(--ng); background: var(--ng-soft); }

/* ===== シミュレーション表示 ===== */
.sim-view { display: flex; flex-direction: column; gap: 8px; align-items: stretch; }
/* 横向きのスマホでも草原全体が画面に入るように、画面の高さでも大きさをおさえる */
.sim-canvas-wrap { position: relative; width: 100%; max-width: min(480px, calc(100svh - 88px)); margin: 0 auto; }
.sim-canvas-wrap canvas { display: block; width: 100%; height: auto; border-radius: 6px; border: 1px solid var(--line); touch-action: manipulation; image-rendering: pixelated; background: #000; }
/* ブラシで描くときだけ、指の動きをページのスクロールに使わない */
.sim-canvas-wrap.brush canvas { cursor: crosshair; touch-action: none; }
.colorbar { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; font-size: 0.82rem; color: var(--ink-2); max-width: 480px; margin: 0 auto; width: 100%; }
.colorbar .bar { height: 10px; border-radius: 5px; border: 1px solid var(--line); }
.colorbar .cb-title { grid-column: 1 / -1; text-align: center; margin-bottom: -6px; }
.readout { font-family: var(--font-mono); font-size: 0.85rem; color: var(--ink-2); text-align: center; min-height: 1.5em; }
.graph canvas, .bars canvas { display: block; width: 100%; height: auto; border-radius: 6px; border: 1px solid var(--line); background: var(--card); touch-action: manipulation; }
.graph-legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 0.85rem; justify-content: center; }
.graph-legend span::before { content: "━ "; }
.playbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: center; }
.playbar .time { font-family: var(--font-mono); font-size: 0.85rem; color: var(--ink-2); min-width: 7em; text-align: center; }

/* ===== 家計簿 ===== */
.ledger { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
.ledger th, .ledger td { padding: 3px 8px; border-bottom: 1px solid var(--line); text-align: right; }
.ledger th:first-child, .ledger td:first-child { text-align: left; }
.ledger thead th { font-size: 0.85rem; color: var(--ink-2); }
.ledger td.num { font-family: var(--font-mono); white-space: nowrap; }
.ledger tr.sum td { font-weight: 700; border-top: 2px solid var(--ink-3); }
.ledger tr.next td { font-weight: 700; background: var(--accent-soft); }
.ledger tr.off td { opacity: 0.4; text-decoration: line-through; }
.ledger .cap { font-size: 0.85rem; color: var(--ink-2); margin-bottom: 4px; }
.ledger-wrap { overflow-x: auto; }

/* ===== 問題 ===== */
.quiz { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; margin: 18px 0; box-shadow: var(--shadow); }
.quiz.solved { border-color: color-mix(in srgb, var(--ok) 60%, var(--line)); }
.quiz-head { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
.quiz-badge { background: var(--accent); color: var(--accent-ink); border-radius: 6px; padding: 0 8px; font-weight: 700; font-size: 0.85rem; }
.quiz-badge.predict { background: var(--t-decay); }
.quiz-state { margin-left: auto; font-size: 0.85rem; color: var(--ok); font-weight: 700; }
.quiz-q > :first-child { margin-top: 0; }
.choices { display: grid; gap: 8px; margin: 10px 0; }
.choice { text-align: left; border: 1.5px solid var(--line); background: var(--card); border-radius: 8px; padding: 8px 12px; cursor: pointer; line-height: 1.6; }
.choice:hover { border-color: var(--accent); }
.choice.picked-ok { border-color: var(--ok); background: var(--ok-soft); }
.choice.picked-ng { border-color: var(--ng); background: var(--ng-soft); }
.choice.reveal { border-color: var(--ok); border-style: dashed; }
.answer-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 10px 0; }
.answer-row input[type=text] { width: 9em; padding: 6px 10px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--card); font-family: var(--font-mono); }
.answer-row input.ok { border-color: var(--ok); background: var(--ok-soft); }
.answer-row input.ng { border-color: var(--ng); background: var(--ng-soft); }
.fill-list { display: grid; gap: 6px; margin: 10px 0; }
.fill-item { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.fill-item .lbl { min-width: 9em; }
.match-list { display: grid; gap: 8px; margin: 10px 0; }
.match-item { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.match-item select { padding: 6px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--card); max-width: 14em; }
.match-item select.ok { border-color: var(--ok); } .match-item select.ng { border-color: var(--ng); }
.feedback { border-radius: 8px; padding: 8px 12px; margin-top: 10px; }
.feedback:empty { display: none; }
.feedback.ok { background: var(--ok-soft); border: 1px solid color-mix(in srgb, var(--ok) 40%, transparent); }
.feedback.ng { background: var(--ng-soft); border: 1px solid color-mix(in srgb, var(--ng) 40%, transparent); }
.feedback.info { background: var(--accent-soft); }
.feedback > :first-child { margin-top: 0; } .feedback > :last-child { margin-bottom: 0; }
.hints { margin-top: 8px; }
.hint { background: var(--hint-soft); border-left: 4px solid var(--hint); padding: 6px 12px; border-radius: 0 8px 8px 0; margin: 6px 0; font-size: 0.95rem; }
.hint b { color: var(--hint); }

/* ===== 電卓 ===== */
.calc-fab { position: fixed; right: 16px; bottom: 16px; z-index: 30; border-radius: 999px; box-shadow: var(--shadow); }
.calc-panel {
  position: fixed; right: 16px; bottom: 64px; z-index: 30; width: 240px;
  background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px; box-shadow: 0 6px 24px rgba(0,0,0,.18);
}
.calc-display { font-family: var(--font-mono); text-align: right; background: var(--card-2); border-radius: 6px; padding: 6px 8px; min-height: 3.2em; word-break: break-all; }
.calc-display .expr { color: var(--ink-2); font-size: 0.8rem; min-height: 1.2em; }
.calc-display .val { font-size: 1.2rem; }
.calc-keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 8px; }
.calc-keys button { min-height: 38px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); cursor: pointer; }
.calc-keys button.op { background: var(--accent-soft); }
.calc-keys button.eq { background: var(--accent); color: var(--accent-ink); }

/* ===== トップ ===== */
.hero { text-align: center; padding: 24px 0 8px; }
.hero h1 { font-size: 1.9rem; margin: 0.2em 0; }
.hero .sub { color: var(--ink-2); }
.cast { display: flex; justify-content: center; gap: 16px; flex-wrap: wrap; margin: 16px 0; }
.cast .who { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 16px; box-shadow: var(--shadow); }
.ch-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; margin: 16px 0; }
.ch-card { display: flex; flex-direction: column; gap: 4px; text-decoration: none; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; box-shadow: var(--shadow); position: relative; }
.ch-card:hover { border-color: var(--accent); }
.ch-card .no { font-size: 0.85rem; color: var(--accent); font-weight: 700; }
.ch-card .ttl { font-weight: 700; font-size: 1.05rem; }
.ch-card .desc { font-size: 0.88rem; color: var(--ink-2); line-height: 1.6; }
.ch-card .mark { position: absolute; top: 10px; right: 12px; font-size: 0.85rem; color: var(--ink-3); }
.ch-card.cleared .mark { color: var(--ok); font-weight: 700; }
.ch-card.last { outline: 2px solid var(--accent); }
.collection { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
.coll-item { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 6px; font-size: 0.82rem; text-align: center; text-decoration: none; color: var(--ink); }
.coll-item img { width: 100%; aspect-ratio: 1; border-radius: 4px; display: block; image-rendering: pixelated; }
.coll-item.locked { opacity: 0.5; border-style: dashed; }
.coll-item .ph { width: 100%; aspect-ratio: 1; border-radius: 4px; display: flex; align-items: center; justify-content: center; background: var(--card-2); color: var(--ink-3); font-size: 1.4rem; }
.muted { color: var(--ink-2); font-size: 0.9rem; }
.center { text-align: center; }
.mt0 { margin-top: 0; }
/* left: 50% のままだと幅が画面の半分で折り返されるので、幅は中身に合わせる。下のボタンを押せなくしない */
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); width: max-content; max-width: calc(100vw - 32px); text-align: center; pointer-events: none; background: var(--ink); color: var(--paper); padding: 8px 18px; border-radius: 999px; z-index: 50; font-size: 0.95rem; box-shadow: var(--shadow); }

@media (max-width: 520px) {
  body { font-size: 15.5px; }
  h1 { font-size: 1.4rem; }
  .page { padding: 12px 16px 96px; }
  .numgrid .cell { width: 3.1em; height: 2.4em; font-size: 0.85rem; }
  .equation { font-size: 1rem; }
  .match-item { grid-template-columns: minmax(0, 1fr); gap: 2px; }
  .match-item select { width: 100%; max-width: 100%; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }

/* ===== 指で操作する端末（スマホ・タブレット） ===== */
@media (pointer: coarse) {
  /* 押す場所を指の大きさに（高さ 36px 以上） */
  .btn.small { min-height: 36px; }
  .app-header .icon-btn { min-height: 38px; }
  .seg button { min-height: 36px; }
  .toggle { min-height: 36px; }
  .toggle input { width: 22px; height: 22px; }
  .slider input[type=range] { height: 36px; }
  .equation .term { padding: 4px 6px; min-width: 40px; text-align: center; }
  .numgrid .cell { min-height: 40px; }
  .numgrid .cell input { height: auto; align-self: stretch; }
  .answer-row input[type=text], .match-item select { min-height: 38px; }
  /* iOS は 16px 未満の入力欄をタップすると画面を拡大してしまうので、入力欄の文字は 16px にする */
  input[type=text], input:not([type]), select, textarea { font-size: 16px !important; }
  /* トーストは電卓ボタンの上に出す */
  .toast { bottom: 68px; }
}
/* 横向きのスマホなど、高さが低い画面：電卓は電卓ボタンの左に出す（上にはみ出さないように） */
@media (max-height: 520px) {
  .calc-panel { bottom: 8px; right: 124px; max-height: calc(100vh - 16px); overflow-y: auto; }
}

<body>
<div id="app"></div>
<noscript>このドリルを使うには JavaScript を有効にしてください。</noscript>
<script>
"use strict";
// core/ui.js
// UI ヘルパー。DOM を組み立てる小さな関数群。
(function (RD) {
  // h('div', {class:'x', onClick: fn, html:'<b>..</b>'}, child, [children], 'text')
  function h(tag, props, ...children) {
    const el = document.createElement(tag);
    if (props) {
      for (const [k, val] of Object.entries(props)) {
        if (val == null || val === false) continue;
        if (k === 'class') el.className = val;
        else if (k === 'style' && typeof val === 'object') Object.assign(el.style, val);
        else if (k === 'html') el.innerHTML = val;
        else if (k === 'text') el.textContent = val;
        else if (k.startsWith('on') && typeof val === 'function') el.addEventListener(k.slice(2).toLowerCase(), val);
        else if (val === true) el.setAttribute(k, '');
        else el.setAttribute(k, val);
      }
    }
    append(el, children);
    return el;
  }
  function append(el, children) {
    for (const c of children.flat(Infinity)) {
      if (c == null || c === false) continue;
      el.appendChild(c instanceof Node ? c : document.createTextNode(String(c)));
    }
    return el;
  }

  // HTML 文字列を段落に。文字列なら innerHTML、ノードならそのまま。
  const p = (html) => h('p', { html });
  const html = (str) => { const t = document.createElement('template'); t.innerHTML = str.trim(); return t.content; };

  // 式。中身は HTML で書く（例: '<i>u</i> + 1'）
  const math = (str) => h('span', { class: 'math', html: str });
  const mathBlock = (str) => h('div', { class: 'math math-block', html: str });
  // 分数の HTML 文字列（math の中で使う）
  const frac = (top, bottom) => `<span class="frac"><span>${top}</span><span>${bottom}</span></span>`;
  const dudt = (f = 'u') => frac(`∂<i>${f}</i>`, '∂<i>t</i>');

  // 章の中の1ステップ。demo を渡すと PC で2カラムになる。
  function step({ title, text = [], demo = null }) {
    const el = h('section', { class: 'step' + (demo ? ' two' : '') });
    if (title) el.appendChild(h('h2', { text: title }));
    el.appendChild(h('div', { class: 'step-text' }, text));
    if (demo) el.appendChild(h('div', { class: 'step-demo' }, demo));
    return el;
  }
  const card = (title, ...children) => h('div', { class: 'card' }, title ? h('div', { class: 'card-title', text: title }) : null, children);
  // kind: '' | 'story' | 'warn' | 'mystery'
  const note = (content, kind = '') => h('div', { class: 'note ' + kind }, typeof content === 'string' ? html(content) : content);
  const more = (title, ...children) => h('details', { class: 'more' }, h('summary', { text: title || 'もっと詳しく' }), h('div', { class: 'body' }, children.map(toNode)));
  const teacher = (...children) => h('details', { class: 'teacher' }, h('summary', { text: '先生用メモ' }), h('div', { class: 'body' }, children.map(toNode)));
  const toNode = (c) => (typeof c === 'string' ? html(c) : c);

  function button(label, onClick, opts = {}) {
    return h('button', { type: 'button', class: 'btn' + (opts.primary ? ' primary' : '') + (opts.small ? ' small' : ''), html: label, onClick, title: opts.title });
  }
  const row = (...children) => h('div', { class: 'row' }, children);

  // つまみ。format で表示形式を変える。
  function slider({ label, min, max, step = 0.01, value, format = (v) => String(v), onInput }) {
    const id = 'sl' + Math.random().toString(36).slice(2, 8);
    const input = h('input', { type: 'range', id, min, max, step, value });
    const out = h('output', { for: id, text: format(+value) });
    const el = h('div', { class: 'slider' }, h('label', { for: id, html: label }), input, out);
    input.addEventListener('input', () => { out.textContent = format(+input.value); onInput && onInput(+input.value); });
    return {
      el,
      get value() { return +input.value; },
      set(v, fire = false) { input.value = v; out.textContent = format(+input.value); if (fire && onInput) onInput(+input.value); },
      input,
    };
  }

  function toggle(label, checked, onChange) {
    const input = h('input', { type: 'checkbox' });
    input.checked = !!checked;
    input.addEventListener('change', () => onChange && onChange(input.checked));
    const el = h('label', { class: 'toggle' }, input, h('span', { html: label }));
    return { el, input, get checked() { return input.checked; }, set(v) { input.checked = v; } };
  }

  // セグメント切り替え。options: [{value, label}]
  function segmented(options, value, onChange) {
    const el = h('div', { class: 'seg', role: 'group' });
    const btns = options.map((o) => {
      const b = h('button', { type: 'button', html: o.label, onClick: () => set(o.value, true) });
      el.appendChild(b);
      return b;
    });
    function set(v, fire) {
      value = v;
      options.forEach((o, i) => btns[i].classList.toggle('on', o.value === v));
      if (fire && onChange) onChange(v);
    }
    set(value, false);
    return { el, set, get value() { return value; } };
  }

  // 数字のマス。values は2次元配列（null は空欄）。editable なら入力欄になる。
  // color(v) で背景色、textColor(v) で文字色の CSS 文字列を返すと色が付く。
  function numGrid({ values, editable = false, format = (v) => String(v), color = null, textColor = null, highlight = null, onChange = null, onCellClick = null }) {
    const rows = values.length, cols = values[0].length;
    const el = h('div', { class: 'numgrid', style: { gridTemplateColumns: `repeat(${cols}, auto)` } });
    const cells = [];
    for (let r = 0; r < rows; r++) {
      cells.push([]);
      for (let c = 0; c < cols; c++) {
        const cell = h('div', { class: 'cell' });
        if (onCellClick) { cell.style.cursor = 'pointer'; cell.addEventListener('click', () => onCellClick(r, c)); }
        el.appendChild(cell);
        cells[r].push(cell);
      }
    }
    let cur = values.map((r) => r.slice());
    function render() {
      for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
        const cell = cells[r][c], v = cur[r][c];
        const isInput = editable === true || (typeof editable === 'function' && editable(r, c));
        cell.classList.remove('ok', 'ng');
        if (isInput) {
          let inp = cell.querySelector('input');
          if (!inp) {
            cell.textContent = '';
            inp = h('input', { type: 'text', inputmode: 'decimal', 'aria-label': `${r + 1}行${c + 1}列` });
            inp.addEventListener('input', () => { cur[r][c] = RD.ui.parseNum(inp.value); onChange && onChange(cur, r, c); });
            cell.appendChild(inp);
          }
          if (v != null && document.activeElement !== inp) inp.value = format(v);
        } else {
          cell.textContent = v == null ? '' : format(v);
        }
        cell.style.background = color && v != null && !isInput ? color(v) : '';
        cell.style.color = textColor && v != null && !isInput ? textColor(v) : '';
        cell.classList.toggle('hl', !!(highlight && highlight(r, c)));
      }
    }
    render();
    return {
      el,
      get values() { return cur; },
      setValues(vals) { cur = vals.map((r) => r.slice()); render(); },
      setHighlight(fn) { highlight = fn; render(); },
      mark(r, c, ok) { cells[r][c].classList.remove('ok', 'ng'); if (ok != null) cells[r][c].classList.add(ok ? 'ok' : 'ng'); },
      cell: (r, c) => cells[r][c],
      render,
    };
  }

  // 全角数字やマイナス記号も受け付ける数値パース。失敗したら NaN。
  function parseNum(s) {
    if (s == null) return NaN;
    s = String(s).trim()
      .replace(/[０-９]/g, (d) => String.fromCharCode(d.charCodeAt(0) - 0xfee0))
      .replace(/[．。]/g, '.').replace(/[−ー―‐－]/g, '-').replace(/[＋]/g, '+').replace(/,/g, '');
    if (s === '' || !/^[+-]?(\d+\.?\d*|\.\d+)$/.test(s)) return NaN;
    return parseFloat(s);
  }

  // 小数を見やすく（末尾の0を落とす）
  function fmt(v, digits = 4) {
    if (!isFinite(v)) return String(v);
    const s = (+v).toFixed(digits);
    return s.includes('.') ? s.replace(/\.?0+$/, '') : s;
  }

  function toast(msg, ms = 2200) {
    const t = h('div', { class: 'toast', role: 'status', text: msg });
    document.body.appendChild(t);
    setTimeout(() => t.remove(), ms);
  }

  // CSS 変数の値を読む（キャンバス描画で使う）
  const cssVar = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

  RD.ui = { h, append, p, html, math, mathBlock, frac, dudt, step, card, note, more, teacher, button, row, slider, toggle, segmented, numGrid, parseNum, fmt, toast, cssVar };
})(window.RD = window.RD || {});


// core/store.js
// 進み具合・コレクション・設定の保存。localStorage が使えなくても動く（メモリに保持）。
(function (RD) {
  const PREFIX = 'rd-drill:';
  const mem = {};

  function get(key, def) {
    try {
      const s = localStorage.getItem(PREFIX + key);
      if (s != null) return JSON.parse(s);
    } catch (e) { /* 使えない環境 */ }
    return key in mem ? mem[key] : def;
  }
  function set(key, val) {
    mem[key] = val;
    try { localStorage.setItem(PREFIX + key, JSON.stringify(val)); } catch (e) { /* 容量超過など */ }
  }
  function remove(key) {
    delete mem[key];
    try { localStorage.removeItem(PREFIX + key); } catch (e) { /* noop */ }
  }

  // 進み具合: { [chapterId]: { solved: [quizId...], cleared: bool } }
  const progress = {
    all() { return get('progress', {}); },
    of(ch) { const p = this.all()[ch]; return p ? { solved: p.solved || [], cleared: !!p.cleared } : { solved: [], cleared: false }; },
    isSolved(ch, qid) { return this.of(ch).solved.includes(qid); },
    markSolved(ch, qid) {
      const all = this.all();
      const p = all[ch] || (all[ch] = { solved: [], cleared: false });
      if (!p.solved.includes(qid)) p.solved.push(qid);
      set('progress', all);
    },
    setCleared(ch) {
      const all = this.all();
      const p = all[ch] || (all[ch] = { solved: [], cleared: false });
      p.cleared = true;
      set('progress', all);
    },
    reset() { remove('progress'); remove('collection'); remove('last'); },
  };

  // コレクション: [{ id, name, F, k, Du, Dv, palette, thumb, source, date }]
  // source: 'challenge'（第7章で再現した模様。id は模様の id）| 'lab'（自作）

// core/quiz.js
// 問題の部品。章からは ctx.quiz(spec) で使う（番号付けと進み具合の記録は ctx が行う）。
//
// 共通: { id, type, q（HTML）, hints:[HTML…最大3], explain（正解後の解説 HTML）, answerText（答えを見るで出す HTML）,
//        onHint(n)（n 個目のヒントを開いたとき）}
// type:
//   choice  { options:[{text, correct, why}] }              why = その選択肢を選んだときの説明（誤答の理由）
//   predict { options:[{text, correct, why}], observe(), observeLabel }  予想→観察→説明。観察したらクリア
//   number  { answer, tol, unit, prefix, wrong(val) → HTML|null }
//   grid    { prefill:[[値 or null]], answer:[[値]], tol, format, color }   null のマスが入力欄
//   match   { left:[HTML], right:[テキスト], answer:[left ごとの right の index] }
//   fill    { blanks:[{label, answer, tol, unit}] }
//   custom  { render(body, api) }  api: { solve(), feedback(html, kind) }
(function (RD) {
  const { h, parseNum, fmt } = RD.ui;

  const defaultTol = (ans) => Math.max(0.0005, Math.abs(ans) * 0.002);
  const close = (val, ans, tol) => isFinite(val) && Math.abs(val - ans) <= (tol ?? defaultTol(ans)) + 1e-12;

  function makeQuiz(ctx, spec) {
    const solvedBefore = ctx.isSolved(spec.id);
    const isPredict = spec.type === 'predict';
    const badge = h('span', { class: 'quiz-badge' + (isPredict ? ' predict' : ''), text: isPredict ? `予想 ${ctx.number}` : `問題 ${ctx.number}` });
    const state = h('span', { class: 'quiz-state', text: solvedBefore ? '✓ クリア' : '' });
    const el = h('div', { class: 'quiz' + (solvedBefore ? ' solved' : ''), id: 'q-' + spec.id },
      h('div', { class: 'quiz-head' }, badge, state));
    el.appendChild(h('div', { class: 'quiz-q' }, typeof spec.q === 'string' ? RD.ui.html(spec.q) : spec.q));
    const body = h('div', { class: 'quiz-body' });

    const feedback = (html, kind) => { fb.className = 'feedback ' + (kind || ''); fb.innerHTML = html || ''; };
    const solve = () => {
      el.classList.add('solved');
      state.textContent = '✓ クリア';
      ctx.solve(spec.id);
    };
    const praise = () => ['正解です！', 'その通り！', 'よくできました！', 'ばっちりです！'][Math.floor(Math.random() * 4)];
    const okMsg = () => `<p><b>${praise()}</b></p>${spec.explain || ''}`;

    // ---- 種類ごとの中身 ----
    const types = {
      choice() {
        const box = h('div', { class: 'choices' });
        spec.options.forEach((opt) => {
          const b = h('button', { type: 'button', class: 'choice', html: opt.text });
          b.addEventListener('click', () => {
            box.querySelectorAll('.choice').forEach((x) => x.classList.remove('picked-ok', 'picked-ng'));
            if (opt.correct) { b.classList.add('picked-ok'); feedback(okMsg(), 'ok'); solve(); }
            else { b.classList.add('picked-ng'); feedback(opt.why || '<p>ちがいます。もう一度考えてみましょう。</p>', 'ng'); }
          });
          box.appendChild(b);
        });
        body.appendChild(box);
      },

      predict() {
        const box = h('div', { class: 'choices' });
        let picked = null;
        const obsBtn = RD.ui.button(spec.observeLabel || '▶ 実際に動かしてたしかめる', () => {
          if (picked == null) return;
          spec.observe && spec.observe();
          box.querySelectorAll('.choice').forEach((x, i) => { if (spec.options[i].correct) x.classList.add('reveal'); });
          const opt = spec.options[picked];
          const head = opt.correct ? '<p><b>予想どおり！</b></p>' : '<p><b>予想とちがいましたね。</b>でも、予想してから見ることが大事です。</p>';

        spec.options.forEach((opt, i) => {

          b.addEventListener('click', () => {

      },

      number() {
        const inp = h('input', { type: 'text', inputmode: 'decimal', 'aria-label': '答え', autocomplete: 'off' });

          const val = parseNum(inp.value);
          inp.classList.remove('ok', 'ng');

          if (!msg && spec.answer !== 0 && close(val, -spec.answer, spec.tol)) msg = '<p>おしい！ 数の大きさは合っています。<b>＋と−（増えるか減るか）</b>をもう一度確認しましょう。</p>';

        body.appendChild(h('div', { class: 'answer-row' }, spec.prefix ? h('span', { html: spec.prefix }) : null, inp, spec.unit ? h('span', { html: spec.unit }) : null, RD.ui.button('答え合わせ', check, { primary: true })));
      },

      grid() {
        const g = RD.ui.numGrid({ values: spec.prefill, editable: (r, c) => spec.prefill[r][c] == null, format: spec.format || ((v) => fmt(v, 3)), color: spec.color });
        const check = () => {
          let all = true, any = false;
          spec.prefill.forEach((row, r) => row.forEach((v, c) => {
            if (v != null) return;
            const ok = close(g.values[r][c], spec.answer[r][c], spec.tol);
            g.mark(r, c, ok); all = all && ok; any = true;
          }));
          if (all && any) { feedback(okMsg(), 'ok'); solve(); }
          else feedback('<p>赤いマスがちがうようです。そのマスだけ、もう一度計算してみましょう。</p>', 'ng');
        };
        body.append(h('div', { style: { overflowX: 'auto', padding: '4px 0' } }, g.el), h('div', { class: 'row', style: { marginTop: '8px' } }, RD.ui.button('答え合わせ', check, { primary: true })));
      },

      match() {
        const list = h('div', { class: 'match-list' });
        const sels = spec.left.map((l) => {

        });
        body.appendChild(list);
        const check = () => {
          let all = true;
          sels.forEach((s, i) => {
            const ok = s.value !== '' && +s.value === spec.answer[i];
            s.classList.remove('ok', 'ng'); s.classList.add(ok ? 'ok' : 'ng'); all = all && ok;
          });
          if (all) { feedback(okMsg(), 'ok'); solve(); }
          else feedback('<p>赤い枠のところがちがうようです。</p>', 'ng');
        };
        body.appendChild(h('div', { class: 'row' }, RD.ui.button('答え合わせ', check, { primary: true })));
      },

      fill() {
        const list = h('div', { class: 'fill-list' });
        const inps = spec.blanks.map((b) => {
          const inp = h('input', { type: 'text', inputmode: 'decimal', autocomplete: 'off', 'aria-label': b.label.replace(/<[^>]+>/g, '') });

          return inp;
        });
        const check = () => {
          let all = true, firstNg = -1;
          spec.blanks.forEach((b, i) => {

            inps[i].classList.remove('ok', 'ng'); inps[i].classList.add(ok ? 'ok' : 'ng');
            if (!ok && firstNg < 0) firstNg = i;
            all = all && ok;
          });
          if (all) { feedback(okMsg(), 'ok'); solve(); }
          else feedback(`<p>赤い欄がちがうようです。まずは「${spec.blanks[firstNg].label}」から見直しましょう。</p>`, 'ng');
        };
        body.append(list, h('div', { class: 'row' }, RD.ui.button('答え合わせ', check, { primary: true })));
      },

      custom() { spec.render(body, { solve, feedback }); },

      const area = h('div', { class: 'hints' });

    return el;

  RD.quizClose = close;

// core/calc.js
// 電卓。章で ctx.useCalc() を呼ぶと右下にボタンが出る。eval は使わず、四則演算とかっこだけを自前で計算する。
(function (RD) {
  const { h, fmt } = RD.ui;

  // 式を計算する（+ − × ÷ とかっこ、小数）。失敗したら NaN。
  function evaluate(src) {
    const s = src.replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-').replace(/\s+/g, '');
    let i = 0;
    const peek = () => s[i];
    function num() {
      const m = /^\d*\.?\d+|^\d+\.?/.exec(s.slice(i));
      if (!m) throw new Error('num');
      i += m[0].length;
      return parseFloat(m[0]);
    }
    function factor() {
      if (peek() === '-') { i++; return -factor(); }
      if (peek() === '+') { i++; return factor(); }
      if (peek() === '(') { i++; const v = expr(); if (peek() === ')') i++; return v; }
      return num();
    }
    function term() {
      let v = factor();
      while (peek() === '*' || peek() === '/') { const op = s[i++]; const r = factor(); v = op === '*' ? v * r : v / r; }
      return v;
    }
    function expr() {
      let v = term();
      while (peek() === '+' || peek() === '-') { const op = s[i++]; const r = term(); v = op === '+' ? v + r : v - r; }
      return v;
    }
    try {
      const v = expr();
      return i === s.length ? v : NaN;
    } catch (e) { return NaN; }
  }

  let panel = null, fab = null;
  function mount() {
    if (fab) { fab.hidden = false; return; }
    let expr = '';
    const exprEl = h('div', { class: 'expr' });
    const valEl = h('div', { class: 'val', text: '0' });
    const show = () => {
      exprEl.textContent = expr;
      const v = evaluate(expr);
      valEl.textContent = expr === '' ? '0' : isFinite(v) ? fmt(v, 8) : '…';
    };
    const press = (k) => {
      if (k === 'C') expr = '';
      else if (k === '←') expr = expr.slice(0, -1);
      else if (k === '=') { const v = evaluate(expr); if (isFinite(v)) expr = fmt(v, 8); }
      else expr += k;
      show();
    };
    const keys = ['C', '(', ')', '←', '7', '8', '9', '÷', '4', '5', '6', '×', '1', '2', '3', '−', '0', '.', '=', '+'];
    const keyEls = keys.map((k) => h('button', { type: 'button', text: k, class: /[÷×−+]/.test(k) ? 'op' : k === '=' ? 'eq' : '', onClick: () => press(k) }));
    panel = h('div', { class: 'calc-panel', role: 'dialog', 'aria-label': '電卓', hidden: true },
      h('div', { class: 'calc-display' }, exprEl, valEl),
      h('div', { class: 'calc-keys' }, keyEls));
    fab = RD.ui.button('🧮 電卓', () => { panel.hidden = !panel.hidden; }, {});
    fab.classList.add('calc-fab');
    document.body.append(panel, fab);
  }
  function unmount() { if (fab) { fab.hidden = true; panel.hidden = true; } }

  RD.calc = { evaluate, mount, unmount };
})(window.RD = window.RD || {});

    for (const part of query.split('&')) {
      if (!part) continue;
      const [k, v = ''] = part.split('=');
      try { params[decodeURIComponent(k)] = decodeURIComponent(v); } catch (e) { /* noop */ }

  // 問題の数字（問題文もここから作る。テストで検算する）

  DATA.grid.answer = nextMap(DATA.grid.u, DATA.grid.dudt, DATA.grid.dt);

  const sgn = (v, d = 3) => (v > 1e-9 ? '+' + fmt(v, d) : v < -1e-9 ? '−' + fmt(-v, d) : '0');
  // 色：草の量（u）は緑の濃さ。速さ（∂u/∂t）は第1章の「速さ＝オレンジ、量＝緑」にそろえて、

  // テーマに合わせて CSS 変数を混ぜる（暗いモードでは項の色が明るめになる）
  const clamp01 = (x) => Math.max(0, Math.min(1, x));
  const uColor = (v) => `color-mix(in srgb, var(--t-u) ${Math.round(clamp01(v) * 58)}%, var(--card))`;

    if (Math.abs(v) < 1e-9) return 'var(--card)';
    return `color-mix(in srgb, ${v > 0 ? D_PLUS : D_MINUS} ${a}%, var(--card))`;
  };
  // ∂u/∂t の地図の色の見本（色だけに頼らず、＋/− の文字も添える）
  const dLegend = () => h('div', { class: 'ch2-dleg', html:
    `<span><i style="background:color-mix(in srgb, ${D_PLUS} 40%, var(--card))"></i>＋ 増える</span>` +
    `<span><i style="background:color-mix(in srgb, ${D_MINUS} 40%, var(--card))"></i>− 減る</span>` +
    '<span><i style="background:var(--card)"></i>0 変わらない</span>' });
  const DU = `<span class="ch2-du">${dudt('u')}</span>`;

  const CSS = `

  .ch2-qmaps { display: flex; flex-wrap: wrap; gap: 12px 18px; align-items: center; margin: 8px 0; }
  .ch2-thermo { display: grid; grid-template-columns: repeat(3, auto); gap: 6px; justify-content: center; margin: 6px 0; }
  .ch2-thermo div { background: var(--card-2); border: 1px solid var(--line); border-radius: 8px; padding: 2px 8px; font-size: 0.85rem; text-align: center; font-family: var(--font-mono); }
  `;

  // 3×3 などの読み取り専用の地図
  const mapView = (vals, color, format) => RD.ui.numGrid({ values: vals, format, color });

  RD.registerChapter({
    id: 'ch2',
    no: 2,
    title: '記号 ∂u/∂t と「場」',
    desc: '草の量は場所ごとの「地図」。∂u/∂t はその場所での変化の速さです。',
    goal: '<i>u</i> は場所ごとに値を持つ地図で、∂<i>u</i>/∂<i>t</i> は「その場所での変化の速さ」だとわかる',
    required: 5, // 全問
    data: Object.assign({ demo: DEMO }, DATA),
    lib: { nextMap },

    render(root, ctx) {
      root.appendChild(h('style', { text: CSS }));

      // ================= 1. u は「地図」（T02, A02） =================
      const sel1 = { r: 2, c: 2 };
      const read1 = h('div', { class: 'ch2-msg', 'aria-live': 'polite' });
      const g1 = RD.ui.numGrid({
        values: DEMO.u, format: (v) => fmt(v, 2), color: uColor,
        highlight: (r, c) => r === sel1.r && c === sel1.c,
        onCellClick: (r, c) => { sel1.r = r; sel1.c = c; g1.render(); show1(); },
      });
      const show1 = () => { read1.innerHTML = `${sel1.r + 1}行${sel1.c + 1}列のマス：草の量 <i class="v t-u">u</i> ＝ <b>${fmt(DEMO.u[sel1.r][sel1.c], 2)}</b>`; };
      show1();

      root.appendChild(step({
        title: '草の量は、場所ごとにちがう',
        text: [
          p('第1章では、草原の<b>1か所</b>だけを見ました。でも本当の草原は広くて、草がたくさん生えている場所も、少ない場所もあります。'),
          p('そこで、草原を小さなマス目に区切って、<b>マスごとに</b>草の量を書きこみます。「5×5 の草原」の図は 25 マスの草原です。色が濃いほど草が多いところです。'),
          note('<p>☀️ <b>天気予報の気温の地図</b>を思い出してください。「東京 18℃、札幌 9℃、那覇 25℃…」と、場所ごとに気温がちがいますね。気温は1つの数ではなく、<b>場所ごとの数の集まり</b>（地図）です。</p>', 'story'),
          p('草の量を <i class="v t-u">u</i> と書くとき、<i class="v t-u">u</i> は1つの数ではありません。<b>マスの数だけ数がある「地図」</b>です。このように、場所ごとに値を持つものを<b>場</b>（ば）といいます。'),
          p('マスをクリック（タップ）すると、そのマスの <i class="v t-u">u</i> が見られます。'),
          more('「場」ということばについて',
            '<p>物理では、場所ごとに値が決まっているものを「場（field）」とよびます。気温の場、風の場、磁石のまわりの磁場など。このドリルの草の量 <i>u</i> も、ウサギの濃さ <i>v</i> も「場」です。</p>' +

      root.appendChild(ctx.quiz({
        id: 'map', type: 'choice',

          { text: '<i>u</i> は 1 つの数。真ん中のマスの 1 が <i>u</i>', why: '<p>真ん中のマスの値は 1 ですが、それは「真ん中のマスの <i>u</i>」です。ほかのマスにはそれぞれ別の値があります。<i>u</i> は1つの数ではありません。</p>' },

        hints: ['天気予報の気温の地図では、「気温はいくつ？」と聞かれたらどう答えますか？', '「どこの気温？」と聞き返したくなりますね。<i>u</i> も同じです。', '<i>u</i> は 25 個の数をまとめた「地図」です。'],

      // ================= 2. 記号 ∂u/∂t（T03, A02, T01） =================

          p(`速さも場所ごとにちがうので、${DU} も<b>地図</b>になります。`),

          more('d と ∂ はどうちがうの？',
            '<p>教科書では <i>du</i>/<i>dt</i> のように、ふつうの d を使うこともあります。これは、<i>u</i> が時間 <i>t</i> だけで決まるとき（第1章の「1か所の草」のように）に使います。</p>' +
            '<p>この章の <i>u</i> は、<b>時間</b>と<b>場所</b>の両方で変わります。そこで「場所は動かさずに、時間の変化だけを見ますよ」という目印として、丸い ∂ を使います。</p>' +

        ],

      root.appendChild(ctx.quiz({
        id: 'partial', type: 'choice',
        q: `<p>${DU} の <b>∂</b>（ラウンド）が表している見方として、正しいのはどれですか？</p>`,
        options: [

          { text: '時間はそのままにして、<b>となりのマスとの差</b>を見る', why: '<p>となりのマスとの比べっこは、第3章・第4章で出てくる別のルールです。∂<i>u</i>/∂<i>t</i> の下には ∂<i>t</i>（時間）があるので、見ているのは<b>時間による変化</b>です。</p>' },
          { text: '場所も時間も、両方いっしょに動かして見る', why: '<p>両方いっしょに動かすと、「時間がたったから変わった」のか「別の場所に行ったから変わった」のか区別できません。∂ は<b>場所を固定</b>する目印です。</p>' },
          { text: '<i>u</i> の<b>値そのもの</b>を表している', why: '<p>∂<i>u</i>/∂<i>t</i> は値ではなく<b>変化の速さ</b>です（第1章の帳簿）。値そのものは <i>u</i> です。</p>' },
        ],
        hints: ['温度計のたとえを思い出しましょう。温度計は歩き回りますか？', '温度計はその場所に立ったまま、針の動き（時間による変化）だけを見ています。', '下の ∂<i>t</i> は「時間」。場所は固定です。'],
        explain: '<p>∂ は「場所を固定して、時間による変化だけを見る」目印です。各マスに立てた温度計の針の動き、と覚えておきましょう。</p>',
      }));

      const R = DATA.rate;
      root.appendChild(ctx.quiz({
        id: 'rate', type: 'choice',
        q: `<p>あるマスで ${DU} ＝ <b>${R.dudt}</b> だと分かりました。このマスについて、正しいのはどれですか？</p>`,
        options: [
          { text: `このマスの草の量は <i>u</i> ＝ ${R.dudt}`, why: `<p>これが ★いちばん多いまちがいです。${R.dudt} は<b>速さ</b>（帳簿）で、<b>量</b>（残高）ではありません。貯金箱の帳簿が +30 円でも、残高が 30 円とは限りませんでしたね。</p>` },
          { text: `このマスの草は 1 秒あたり ${R.dudt} ずつ増えている。いまの量 <i>u</i> は、これだけでは分からない`, correct: true },
          { text: `このマスの草は 1 秒あたり ${R.dudt} ずつ減っている`, why: `<p>${R.dudt} はプラスなので、<b>増えて</b>います。減っているなら、マイナスの数になります。</p>` },
          { text: `草原のどのマスでも、草は ${R.dudt} ずつ増えている`, why: '<p>∂<i>u</i>/∂<i>t</i> も<b>地図</b>です。マスごとに速さはちがいます。分かったのは「このマス」の速さだけです。</p>' },
        ],
        hints: ['∂<i>u</i>/∂<i>t</i> は「量」と「速さ」のどちらでしたか？', '速さが分かっても、いまの量は分かりません（帳簿を見ても、残高は分からない）。', 'プラスの速さは「増えている」。そして、このマスの話だけです。'],
        explain: `<p>${DU} ＝ ${R.dudt} は「このマスでは、草が1秒あたり ${R.dudt} ずつ増えている」という意味です。いまの量は、<i>u</i> の地図を見ないと分かりません。</p>`,
      }));

      // ================= 3. 地図ぜんぶを1コマ進める（M02 の家計簿） =================
      const sim = new RD.Sim({ w: 5, h: 5, Du: DEMO.Du, dt: DEMO.dt, terms: { feed: false, react: false, decay: false } });
      const load = () => { sim.reset(); DEMO.u.forEach((row, r) => row.forEach((x, c) => { sim.u[sim.idx(c, r)] = x; })); };
      load();
      const sel = { r: 1, c: 1 };
      const uVals = () => Array.from({ length: 5 }, (_, r) => Array.from({ length: 5 }, (_, c) => sim.u[sim.idx(c, r)]));
      const dVals = () => Array.from({ length: 5 }, (_, r) => Array.from({ length: 5 }, (_, c) => sim.breakdown(sim.idx(c, r)).dudt));
      const pick = (r, c) => { sel.r = r; sel.c = c; msg.innerHTML = ''; lastNext = sim.breakdown(sim.idx(c, r)).uNext; draw3(); };
      const hl = (r, c) => r === sel.r && c === sel.c;
      const gU = RD.ui.numGrid({ values: uVals(), format: (v) => fmt(v, 3), color: uColor, highlight: hl, onCellClick: pick });
      const gD = RD.ui.numGrid({ values: dVals(), format: (v) => sgn(v, 3), color: dColor, highlight: hl, onCellClick: pick });
      const ledBody = h('tbody');
      const ledCap = h('div', { class: 'cap' });
      const led = h('div', { class: 'ledger-wrap ch2-led' }, ledCap, h('table', { class: 'ledger' }, ledBody));
      const msg = h('div', { class: 'ch2-msg', 'aria-live': 'polite' });
      let lastNext = sim.breakdown(sim.idx(sel.c, sel.r)).uNext;
      const tr = (label, val, cls) => h('tr', { class: cls }, h('td', { html: label }), h('td', { class: 'num', html: val }));
      function draw3() {
        gU.setValues(uVals());
        gD.setValues(dVals());
        const b = sim.breakdown(sim.idx(sel.c, sel.r));
        ledCap.innerHTML = `📒 えらんだマス（${sel.r + 1}行${sel.c + 1}列）の家計簿`;
        ledBody.replaceChildren(
          tr('今の草の量 <i class="v t-u">u</i>', fmt(b.u, 3)),
          tr(`変化の速さ ${math(dudt('u')).outerHTML}`, sgn(b.dudt, 3)),
          tr('時間の刻み Δ<i>t</i>', fmt(b.dt, 2)),
          tr(`変わる分 ${math(dudt('u') + ' × Δ<i>t</i>').outerHTML}`, sgn(b.dudt * b.dt, 3), 'sum'),
          tr('新しい <i class="v t-u">u</i>', fmt(b.uNext, 3), 'next'));
      }
      const runner = new RD.Runner({
        sim,
        speeds: [{ label: 'ゆっくり', spf: 1 / 50 }, { label: 'ふつう', spf: 1 / 15 }], speed: 0,
        onFrame: draw3,
        onStep: () => {
          const now = sim.u[sim.idx(sel.c, sel.r)];
          msg.innerHTML = `さっきの「新しい <i>u</i>」${fmt(lastNext, 3)} が、いまの <i>u</i> ＝ ${fmt(now, 3)} になりました <b>✓</b>`;
          lastNext = sim.breakdown(sim.idx(sel.c, sel.r)).uNext;
        },
        onReset: () => { load(); msg.innerHTML = ''; lastNext = sim.breakdown(sim.idx(sel.c, sel.r)).uNext; },
        timeLabel: (s) => `${s.steps} コマ目（時刻 ${fmt(s.time, 2)}）`,
      });

      root.appendChild(step({
        title: '地図ぜんぶを、1コマ進める',
        text: [
          p('第1章のルール「新しい値 ＝ 今の値 ＋ 速さ × 時間」を、新しい記号で書くとこうなります。'),
          mathBlock(`新しい <i class="t-u">u</i> ＝ <i class="t-u">u</i> ＋ ${dudt('u')} × Δ<i>t</i>`),
          p('Δ<i>t</i> は「<b>デルタ ティー</b>」と読み、<b>時間の刻み</b>（1コマぶんの時間）のことです。第1章で「時間の刻み」とよんでいたものに、記号の名前がついただけです。'),
          p('このルールを、<b>すべてのマスで同時に</b>使います。マスごとに <i>u</i> も ∂<i>u</i>/∂<i>t</i> もちがうので、それぞれのマスが自分の「家計簿」で計算します。'),
          h('ol', null,
            h('li', { html: '<i>u</i> の地図と、∂<i>u</i>/∂<i>t</i> の地図をくらべる。同じ場所のマスどうしが組です。' }),

      // デモ (a)：1列20マスの棒グラフ
      function buildBarDemo() {
        const sim = newSim(0.5, 1);
        const shapes = {
          mountain: () => DATA.mountain.slice(),
          stepUp: () => Array.from({ length: N }, (_, i) => (i >= 5 && i < 15 ? 12 : 2)),
          bumpy: () => Array.from({ length: N }, () => Math.round(Math.random() * 20)),
        };
        let shape = 'mountain', picked = DATA.top;
        const bar = new RD.BarView({
          get: () => sim.u, min: 0, max: 22, color: '--t-u', labels: wide(), labelDigits: 1, height: 230, highlight: picked,
          onPick: (i) => { picked = i; showDetail(); },
        });
        const detail = h('table', { class: 'ledger ch3-detail' });
        const status = h('div', { class: 'ch3-status' });
        const load = () => {
          sim.reset(0, 0); sim.u.set(shapes[shape]());
          bar.set({ refLine: sumOf(sim.u) / N });
        };
        const showDetail = () => {
          const i = picked, b = sim.breakdown(i);
          const L = sim.u[(i + N - 1) % N], Rr = sim.u[(i + 1) % N];
          const f = (x) => fmt(x, 2);
          const rows = [
            ['左どなり・右どなり', `${f(L)} と ${f(Rr)}`],
            ['隣の平均', f(b.avgU)],
            ['自分（今の値）', f(b.u)],
            ['差（隣の平均 − 自分）', `<span class="t-diff">${sgn(b.lapU)}</span>`],
            [`増える分（${fmt(sim.Du, 2)} × 差 × ${fmt(sim.dt, 2)}）`, `<span class="t-diff">${sgn(b.diffU * b.dt)}</span>`],
          ];
          detail.replaceChildren(
            h('caption', { class: 'cap', style: { captionSide: 'top', textAlign: 'left' }, text: `${i + 1} 番目のマスの計算` }),
            h('tbody', null,
              rows.map(([k, v]) => h('tr', null, h('td', { html: k }), h('td', { class: 'num', html: v }))),
              h('tr', { class: 'next' }, h('td', { text: '次の値（今の値 ＋ 増える分）' }), h('td', { class: 'num', text: f(b.uNext) }))));
          status.innerHTML = `タネの合計：<b>${fmt(sumOf(sim.u), 2)}</b>（点線は、最後にそろう高さ ${fmt(sumOf(sim.u) / N, 2)}）`;
        };
        const draw = () => { bar.set({ labels: wide(), highlight: picked }); showDetail(); };
        const runner = new RD.Runner({
          sim, onFrame: draw,
          onReset: load,
          speeds: [{ label: 'ゆっくり', spf: 0.08 }, { label: 'ふつう', spf: 0.3 }, { label: 'はやい', spf: 1 }], speed: 0,
        });
        const dSlider = RD.ui.slider({
          label: '<i class="v">D</i>（広がりやすさ）', min: 0.05, max: 1, step: 0.05, value: 0.5,
          format: (v) => `${fmt(v, 2)}`,
          onInput: (v) => { sim.setParams({ Du: v }); showDetail(); dtNote.innerHTML = dtText(); },
        });
        const dtText = () => `Δ<i class="v">t</i> = 1 で固定 → <i class="v">D</i> × Δ<i class="v">t</i> = <b>${fmt(sim.Du * sim.dt, 2)}</b>`;
        const dtNote = h('div', { class: 'muted center', html: dtText() });
        const seg = RD.ui.segmented([{ value: 'mountain', label: '山' }, { value: 'stepUp', label: '台地' }, { value: 'bumpy', label: 'でこぼこ' }], shape, (v) => { shape = v; runner.pause(); load(); runner.draw(); });
        load();
        runner.draw();
        const el = card('1列20マスの草原（棒の高さ ＝ タネの量）',
          h('div', { class: 'row', style: { marginBottom: '8px' } }, h('span', { class: 'muted', text: '最初の形：' }), seg.el),
          bar.el,
          h('div', { class: 'ch3-axis' }, h('span', { text: '1' }), h('span', { text: 'マスの番号' }), h('span', { text: String(N) })),
          runner.el, dSlider.el, dtNote, status,
          h('div', { class: 'ledger-wrap' }, detail),
          h('p', { class: 'muted', html: '棒をクリック（タップ）すると、そのマスの計算が見られます。両はしのマスは、反対のはしとつながっています。' }));
        return { el, sim, runner };
      }

      // 予想「D を2倍にすると？」の観察用（2本を同時に動かす）
      function buildCompare() {
        const [d1, d2] = DATA.compare;
        const a = newSim(d1, 1), b = newSim(d2, 1);
        const load = () => { [a, b].forEach((s) => { s.reset(0, 0); s.u.set(DATA.mountain); }); };
        load();
        const mk = (s) => new RD.BarView({ get: () => s.u, min: 0, max: 22, color: '--t-u', height: 150, refLine: sumOf(DATA.mountain) / N });
        const va = mk(a), vb = mk(b);
        const la = h('div', { class: 'lbl' }), lb = h('div', { class: 'lbl' });
        const label = () => {
          la.innerHTML = `<i class="v">D</i> = ${d1}　てっぺん：${fmt(a.u[DATA.top], 2)}`;
          lb.innerHTML = `<i class="v">D</i> = ${d2}（2倍）　てっぺん：${fmt(b.u[DATA.top], 2)}`;
        };
        const runner = new RD.Runner({
          sim: a, onStep: () => b.step(1),
          onFrame: () => { va.render(); vb.render(); label(); },
          onReset: () => { load(); },
          speeds: [{ label: 'ゆっくり', spf: 0.1 }, { label: 'ふつう', spf: 0.4 }], speed: 0,
        });
        const el = card('くらべてみよう：D を2倍にすると', h('div', { class: 'ch3-cmp' }, la, va.el, lb, vb.el), runner.el,
          h('p', { class: 'muted', text: '点線は、最後にそろう高さです。2つとも同じ点線に近づいていきます。' }));
        el.hidden = true;
        return {
          el,
          start() {
            el.hidden = false;
            runner.pause(); load(); runner.draw();
            el.scrollIntoView({ behavior: 'smooth', block: 'center' });
            setTimeout(() => runner.play(), 400);
          },
        };
      }

      // デモ (b)：粒の見方 と 値の見方（M11）
      function buildParticles() {
        const H = 260, W = 320, padL = 6, padR = 6, padB = 10, padT = 10;
        const PER_ROW = 3, BASE_MAX = 140;
        const sim = newSim(2 * DATA.hop, 1);
        let scale = 1, pos = new Int16Array(0), overlay = false;
        const canvas = h('canvas', { class: 'ch3-canvas', width: W, height: H, role: 'img', 'aria-label': '粒のようす' });
        const bars = new RD.BarView({ get: () => sim.u, min: 0, max: BASE_MAX, color: '--t-u', height: H });
        bars.canvas.width = W; bars.render();
        const cap = h('div', { class: 'muted center' });
        const reset = () => {
          const start = DATA.particleStart.map((c) => c * scale);
          const total = sumOf(start);
          pos = new Int16Array(total);
          let k = 0;
          start.forEach((c, i) => { for (let j = 0; j < c; j++) pos[k++] = i; });
          sim.reset(0, 0); sim.u.set(start);
          bars.set({ max: BASE_MAX * scale });
          cap.innerHTML = scale === 1 ? `粒は全部で ${total} 個（●1つ ＝ 粒1個）` : `粒は全部で ${total} 個（●1つ ＝ 粒${scale}個）`;
        };
        const hop = () => {
          const q = DATA.hop;
          for (let j = 0; j < pos.length; j++) {
            const r = Math.random();
            if (r < q) pos[j] = (pos[j] + N - 1) % N;
            else if (r < 2 * q) pos[j] = (pos[j] + 1) % N;
          }
        };
        const draw = () => {
          const ctx2 = canvas.getContext('2d');
          ctx2.clearRect(0, 0, W, H);
          const bw = (W - padL - padR) / N;
          const unit = (H - padT - padB) / BASE_MAX; // 粒1個（表示単位）あたりの高さ
          const s = unit * PER_ROW;
          const counts = new Array(N).fill(0);
          for (let j = 0; j < pos.length; j++) counts[pos[j]]++;
          ctx2.fillStyle = RD.ui.cssVar('--t-u') || '#3a8a35';
          for (let i = 0; i < N; i++) {
            const dots = Math.round(counts[i] / scale);
            for (let k = 0; k < dots; k++) {
              const row = Math.floor(k / PER_ROW), col = k % PER_ROW;
              const x = padL + i * bw + (col + 0.5) * (bw / PER_ROW), y = H - padB - (row + 0.5) * s;
              if (y < padT) break;
              ctx2.beginPath(); ctx2.arc(x, y, Math.max(1.2, Math.min(bw / PER_ROW, s) * 0.38), 0, Math.PI * 2); ctx2.fill();
            }
          }
          ctx2.strokeStyle = RD.ui.cssVar('--ink-2') || '#555'; ctx2.lineWidth = 1;
          ctx2.beginPath(); ctx2.moveTo(padL, H - padB + 0.5); ctx2.lineTo(W - padR, H - padB + 0.5); ctx2.stroke();
          if (overlay) {
            ctx2.strokeStyle = RD.ui.cssVar('--t-diff') || '#2f68b0'; ctx2.lineWidth = 2;
            ctx2.beginPath();
            for (let i = 0; i < N; i++) {
              const y = H - padB - (sim.u[i] / scale) * unit;
              ctx2.moveTo(padL + i * bw + 1, y); ctx2.lineTo(padL + (i + 1) * bw - 1, y);
            }
            ctx2.stroke();
          }
          bars.render();
        };
        const runner = new RD.Runner({
          sim, onStep: hop, onFrame: draw, onReset: reset,

            h('div', null, h('div', { class: 'lbl', text: '値：おすそ分けルール' }), bars.el)),
          cap, runner.el,
          h('div', { class: 'row', style: { justifyContent: 'center', marginTop: '6px' } }, seg.el, tg.el));
        return { el };
      }

      // デモ (c)：わざと壊す（M08）
      function buildBreak() {
        const sim = newSim(0.5, 1);
        const LIM = 25, BLOW = 1e4;
        let blown = false, runner = null;
        const bar = new RD.BarView({ get: () => sim.u, min: -LIM, max: LIM, color: '--t-u', height: 240 });
        const status = h('div', { class: 'ch3-status' });
        const sliderBox = h('div');
        const load = () => {
          sim.reset(0, 0); sim.u.set(DATA.mountain);
          blown = false;
          if (runner) [runner.playBtn, runner.stepBtn].forEach((b) => { b.disabled = false; });
        };
        const say = () => {
          const [lo, hi] = minMax(sim.u);
          const big = (x) => (!isFinite(x) ? 'とても大きい' : (x < -1e-9 ? '−' : '') + (Math.abs(x) >= 1e4 ? fmt(Math.abs(x) / 1e4, 1) + '万' : fmt(Math.abs(x), 2)));
          if (blown) {
            status.className = 'ch3-status bad';
            status.innerHTML = `💥 爆発しました！ いちばん大きい値 ${big(hi)}、いちばん小さい値 ${big(lo)}（グラフは ±${LIM} で切っています）<br>「↺ はじめから」で戻せます。`;
          } else {
            status.className = 'ch3-status' + (Math.max(Math.abs(lo), Math.abs(hi)) > LIM ? ' bad' : '');
            status.innerHTML = `いちばん大きい値 <b>${big(hi)}</b>　いちばん小さい値 <b>${big(lo)}</b>` + (lo < -1e-9 ? '　← マイナス！' : '') + (Math.max(-lo, hi) > LIM ? '<br>（グラフからはみ出しています）' : '');
          }
        };
        const onStep = () => {
          if (blown) return;
          const [lo, hi] = minMax(sim.u);
          if (!isFinite(lo) || !isFinite(hi) || Math.max(-lo, hi) > BLOW) {
            blown = true;
            runner.pause();
            [runner.playBtn, runner.stepBtn].forEach((b) => { b.disabled = true; });
          }
        };
        runner = new RD.Runner({
          sim, onStep, onFrame: () => { bar.render(); say(); },
          onReset: load,
          onExplode: () => { blown = true; },
          speeds: [{ label: 'ゆっくり', spf: 0.08 }, { label: 'ふつう', spf: 0.3 }], speed: 0,
        });
        const sl = RD.ui.slider({
          label: '<i class="v">D</i> × Δ<i class="v">t</i>', min: 0.1, max: DATA.breakMax, step: 0.05, value: 0.5,
          format: (v) => fmt(v, 2) + (v > 1 + 1e-9 ? '（配りすぎ）' : ''),
          onInput: (v) => { sim.setParams({ Du: v }); sliderBox.classList.toggle('ch3-slider-bad', v > 1 + 1e-9); },
        });
        sliderBox.appendChild(sl.el);
        load(); runner.draw();
        const el = card('わざと壊すデモ（縦軸は −25 〜 25）',
          sliderBox, bar.el, runner.el, status,
          h('p', { class: 'muted', html: 'つまみを 1 より大きくして ▶ 再生してみましょう。「1コマ進める」で1コマずつ見ると、シーソーのように上下が入れかわるのがわかります。' }));
        return {
          el,
          run(v) {
            sl.set(v, true);
            runner.pause(); load(); runner.draw();
            el.scrollIntoView({ behavior: 'smooth', block: 'center' });
            setTimeout(() => runner.play(), 400);
          },
        };
      }
    },

      // 3×3 の ∇² デモ（計算は RD.Sim で行う＝コンピュータの答え）
      function buildLapDemo() {
        const sim = new RD.Sim({ w: 3, h: 3, terms: Object.assign({}, DIFF_ONLY) });
        const presets = {
          valley: { up: 3, left: 3, self: 1, right: 3, down: 3 },
          peak: { up: 2, left: 2, self: 6, right: 2, down: 2 },
          slope: { up: 4, left: 2, self: 4, right: 6, down: 4 },
          mixed: { up: 6, left: 2, self: 5, right: 5, down: 3 },
        };
        const out = h('div', { class: 'ch4-lap', 'aria-live': 'polite' });
        const isCell = (r, c) => (r + c) % 2 === 1 || (r === 1 && c === 1);
        const grid = RD.ui.numGrid({
          values: toGrid(presets.valley),
          editable: isCell,
          highlight: (r, c) => r === 1 && c === 1,
          format: (v) => fmt(v, 3),
          onChange: () => update(),
        });
        [[0, 0], [0, 2], [2, 0], [2, 2]].forEach(([r, c]) => { grid.cell(r, c).classList.add('dim'); grid.cell(r, c).title = 'ななめのマスは使いません'; });
        function update() {
          const g = grid.values;
          const vals = { up: g[0][1], left: g[1][0], self: g[1][1], right: g[1][2], down: g[2][1] };
          if (Object.values(vals).some((x) => x == null || !isFinite(x))) {
            out.innerHTML = '<span class="cmt muted">5つのマスに数字を入れてください</span>';
            return;
          }
          sim.u.fill(0);
          sim.u.set([0, vals.up, 0, vals.left, vals.self, vals.right, 0, vals.down, 0]);
          const b = sim.breakdown(4);
          const lap = b.lapU;
          const f = (x) => fmt(x, 3);
          const meaning = lap > 1e-9 ? '<b class="t-diff">プラス</b>：まわりより低い<b>谷</b>。埋まって増えます。'
            : lap < -1e-9 ? '<b class="t-diff">マイナス</b>：まわりより高い<b>山</b>。削られて減ります。'
              : '<b class="t-diff">0</b>：まわりの平均と同じ。変わりません。';
          out.innerHTML =
            `<div>まわりの平均 ＝ (${f(vals.up)} ＋ ${f(vals.left)} ＋ ${f(vals.right)} ＋ ${f(vals.down)}) ÷ 4 ＝ ${f(b.avgU)}</div>` +
            `<div class="big">∇²<i>u</i> ＝ ${f(b.avgU)} − ${f(vals.self)} ＝ <span class="t-diff">${sgn(lap)}</span></div>` +
            `<div class="cmt">${meaning}</div>`;
        }
        const set = (k) => { grid.setValues(toGrid(presets[k])); update(); };
        update();
        const el = card('真ん中のマスの ∇²u',
          h('div', { class: 'row', style: { marginBottom: '10px', justifyContent: 'center' } },
            RD.ui.button('谷', () => set('valley'), { small: true }),
            RD.ui.button('山', () => set('peak'), { small: true }),
            RD.ui.button('坂', () => set('slope'), { small: true }),
            RD.ui.button('まぜこぜ', () => set('mixed'), { small: true })),
          h('div', { class: 'ch4-gridwrap' }, grid.el),
          out,
          h('p', { class: 'muted', html: 'マスの数字は書き換えられます。点線のななめのマスは使いません。' }));
        return { el };
      }

      // 2次元のインク（拡散だけ）
      function buildInk() {
        const I = DATA.ink;
        const sim = new RD.Sim({ w: I.size, h: I.size, Du: I.D, dt: I.dt, terms: Object.assign({}, DIFF_ONLY) });
        let start = 'center';
        const statsEl = h('div', { class: 'ch4-stats' });
        const pickEl = h('div', { class: 'readout' });
        const view = new RD.FieldView(sim, {
          field: 'u', palette: 'ink', range: [0, 1], readout: false, maxPx: 448,
          title: '色 ＝ インク（タネ）の濃さ <i class="v">u</i>',
          picked: sim.idx(I.center[0], I.center[1]),
          onPick: () => showPick(),
        });
        const drop = (cx, cy) => {
          sim.reset(0, 0);
          const r = I.radius;
          for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
            if (dx * dx + dy * dy > r * r) continue;
            const x = (cx + dx + I.size) % I.size, y = (cy + dy + I.size) % I.size;
            sim.u[sim.idx(x, y)] = I.value;
          }
        };
        const load = () => {
          if (start === 'center') drop(I.center[0], I.center[1]);
          else if (start === 'edge') drop(I.edge[0], I.edge[1]);
          else { sim.reset(0, 0); for (let i = 0; i < sim.n; i++) sim.u[i] = Math.random(); }
        };
        const showPick = () => {
          if (view.picked == null) { pickEl.textContent = 'マスをクリック（タップ）すると値が見られます'; return; }
          const [x, y] = sim.xy(view.picked);
          pickEl.innerHTML = `えらんだマス（${x + 1}, ${y + 1}）の濃さ <i class="v">u</i> ＝ <b>${fmt(sim.u[view.picked], 4)}</b>`;
        };
        const showStats = () => {
          let lo = Infinity, hi = -Infinity, sum = 0;
          for (let i = 0; i < sim.n; i++) { const a = sim.u[i]; sum += a; if (a < lo) lo = a; if (a > hi) hi = a; }
          statsEl.replaceChildren(
            h('div', { html: `いちばん濃い<b>${fmt(hi, 4)}</b>` }),
            h('div', { html: `いちばんうすい<b>${fmt(lo, 4)}</b>` }),
            h('div', { html: `インクの合計<b>${fmt(sum, 1)}</b>` }));
        };
        const frame = () => { view.render(); showPick(); showStats(); };
        const runner = new RD.Runner({
          sim, onFrame: frame, onReset: load,
          speeds: [{ label: 'ゆっくり', spf: 1 }, { label: 'ふつう', spf: 4 }, { label: 'はやい', spf: 16 }], speed: 1,
        });
        const startWith = (s) => { start = s; runner.pause(); load(); runner.draw(); };
        const rangeSeg = RD.ui.segmented([{ value: 1, label: '0〜1' }, { value: 0.1, label: '0〜0.1' }], 1, (v) => {
          view.setField('u', [0, v]);
          if (v < 1) view.cbHi.textContent = fmt(v, 2) + ' 以上';
        });
        load(); runner.draw();
        const el = card('64×64 の草原：拡散だけ',
          h('div', { class: 'row', style: { justifyContent: 'center', marginBottom: '8px' } },
            RD.ui.button('真ん中に1滴', () => startWith('center'), { small: true }),
            RD.ui.button('端の近くに1滴', () => startWith('edge'), { small: true }),
            RD.ui.button('でこぼこにまく', () => startWith('random'), { small: true })),
          view.el, pickEl, runner.el,
          h('div', { class: 'row', style: { justifyContent: 'center', margin: '8px 0' } }, h('span', { class: 'muted', text: '色の範囲：' }), rangeSeg.el),
          statsEl);
        return {
          el,
          randomRun() {
            rangeSeg.set(1, true);
            startWith('random');
            runner.speedSeg && runner.speedSeg.set(2, true);
            el.scrollIntoView({ behavior: 'smooth', block: 'center' });
            setTimeout(() => runner.play(), 400);
          },
        };
      }
    },
  });
})(window.RD = window.RD || {});

    };

  RD.registerChapter({
